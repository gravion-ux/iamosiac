[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iamosaic"
version = "0.1.0"
description = "Offline cloud-IAM policy review and permission-relationship visualization data."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
iamosaic = "iamosaic.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
